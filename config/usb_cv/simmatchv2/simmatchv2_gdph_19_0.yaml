algorithm: simmatchv2
save_dir: ./saved_models/usb_cv/
save_name: simmatchv2_gdph_19_0
resume: False
load_path: ./saved_models/usb_cv/simmatchv2_gdph_19_0/latest_model.pth
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 50
num_train_iter: 1200
num_log_iter: 24
num_eval_iter: 24
batch_size: 8
eval_batch_size: 16
num_warmup_iter: 48
num_labels: 192
label_ratio: 0.1
fold: 1
uratio: 30
ema_m: 0.999
# ----- SimMatchV2 图一致性超参 (与 BUS 设置一致, K 按 GDPH 调整) -----
t: 0.1
alpha: 0.1
topn: 128
K: 1440                # 无标注队列长度 (240 的倍数, < GDPH 无标注 1924)
proj_size: 128
p_cutoff: 0.9
ulb_loss_ratio: 10.0   # = lambda_nn
lambda_ee: 5.0
lambda_ne: 5.0
da_len: 256
use_da: True
# -------------------------------------------------------------------
img_size: 224
crop_ratio: 0.875
optim: SGD
lr: 0.0046875
sched: linear
lr_drop_iter: 360 720 1080
layer_decay: 1.0
momentum: 0.9
weight_decay: 0.0005
amp: False
clip: 0.0
use_cat: True
net: resnet18
net_from_name: False
data_dir: ../uda_data/GDPH
dataset: gdph
train_sampler: RandomSampler
num_classes: 2
num_workers: 4
seed: 0
split_seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10119
dist_backend: nccl
gpu: None
use_pretrain: False
pretrain_path: https://download.pytorch.org/models/resnet18-5c106cde.pth

algorithm: simmatch
save_dir: ./saved_models/usb_cv/
save_name: simmatch_gdph_19_Bprobe_0
resume: False
load_path: ./saved_models/usb_cv/simmatch_gdph_19_Bprobe_0/latest_model.pth
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 50
num_train_iter: 1200
num_log_iter: 24
num_eval_iter: 24
batch_size: 8
eval_batch_size: 16
num_warmup_iter: 48
num_labels: 192
label_ratio: 0.1
fold: 1
uratio: 30
ema_m: 0.999
# ----- SimMatch 超参 (B 方案: 压制不稳定性) -----
T: 0.1
p_cutoff: 0.95         # B: 0.9->0.95, 只学高置信伪标签
proj_size: 128
K: 256
in_loss_ratio: 2.0     # B: 5.0->2.0, 降低 instance loss 对确认偏置的放大
ulb_loss_ratio: 10.0
smoothing_alpha: 0.9
da_len: 256
use_epass: False
use_da: True
# ----- DA 目标: 真实先验 (沿用 gt-prior) -----
da_p_target_type: gt
da_p_target: "0.368,0.632"
# -------------------------------------------------------------------
img_size: 224
crop_ratio: 0.875
optim: SGD
lr: 0.0046875
sched: linear
lr_drop_iter: 360 720 1080
layer_decay: 1.0
momentum: 0.9
weight_decay: 0.0005
amp: False
clip: 0.0
use_cat: True
net: resnet18
net_from_name: False
data_dir: ../uda_data/GDPH
dataset: gdph
train_sampler: RandomSampler
num_classes: 2
num_workers: 4
seed: 0
split_seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10039
dist_backend: nccl
gpu: None
use_pretrain: False
pretrain_path: https://download.pytorch.org/models/resnet18-5c106cde.pth

algorithm: simmatch
save_dir: ./saved_models/usb_cv/
save_name: simmatch_bus_878_0
resume: False
load_path: ./saved_models/usb_cv/simmatch_bus_878_0/latest_model.pth
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 50
num_train_iter: 5500
num_log_iter: 110
num_eval_iter: 110
batch_size: 8
eval_batch_size: 16
num_warmup_iter: 220
num_labels: 878
uratio: 30
ema_m: 0.999
# ----- SimMatch 专属超参 (沿用 SimMatch-main 的 BUS 设置) -----
T: 0.1                 # st=tt=0.1
p_cutoff: 0.9          # threshold=0.9
proj_size: 128
K: 256                 # 运行时自动覆盖为标注集长度
in_loss_ratio: 5.0     # lambda_in=5
ulb_loss_ratio: 10.0   # lambda_u=10
smoothing_alpha: 0.9   # c_smooth=0.9
da_len: 256
use_epass: False       # 官方 SimMatch 单投影头, 关掉 USB 的 epass
use_da: True           # DA 开关 (对比时改 False)
# -------------------------------------------------------------
img_size: 224
crop_ratio: 0.875
optim: SGD
lr: 0.0046875          # 与你实际 BUS 方法一致 (非 0.009375)
sched: linear
lr_drop_iter: 1650 3300 4950   # 30%/60%/90% of 5500, 与 fixmatchif_bus 一致
layer_decay: 1.0
momentum: 0.9
weight_decay: 0.0005
amp: False
clip: 0.0
use_cat: True
net: resnet18
net_from_name: False
data_dir: ../uda_data
dataset: bus
train_sampler: RandomSampler
num_classes: 2
num_workers: 4
seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10021
dist_backend: nccl
gpu: None
use_pretrain: False
lpath: ../data_split/28/labeled_images_20_9.pth
ulpath: ../data_split/28/unlabeled_images_80_9.pth
pretrain_path: https://download.pytorch.org/models/resnet18-5c106cde.pth
